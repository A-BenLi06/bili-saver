name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOPROXY: https://goproxy.cn,direct
  GOFLAGS: -mod=readonly

jobs:
  check:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l internal cmd)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build ./internal/... ./cmd/...
      - name: Vet
        run: go vet ./internal/... ./cmd/...
      - name: Test
        run: go test -count=1 -timeout 5m ./internal/...
      - name: Race detector
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout 10m ./internal/...
      - name: Check release packaging
        env:
          TARGET_OS: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
        run: |
          python scripts/release.py --version 0.0.0-ci --os "$TARGET_OS" --arch amd64
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          directory = Path(os.environ['RUNNER_TEMP']) / 'release-smoke'
          shutil.unpack_archive(next(Path('dist').glob('*')), directory)
          name = 'bili-saver.exe' if os.environ['TARGET_OS'] == 'windows' else 'bili-saver'
          binary = next(directory.rglob(name))
          version = subprocess.check_output([str(binary), 'version'], text=True).strip()
          assert version == 'bili-saver 0.0.0-ci', version
          PY

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Go version
        id: go
        run: echo "version=$(awk '$1 == "go" {print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: bili-saver:ci
          build-args: |
            GO_VERSION=${{ steps.go.outputs.version }}
            VERSION=0.0.0-ci
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
      - name: Check packaged runtime
        run: |
          test "$(docker run --rm bili-saver:ci version)" = 'bili-saver 0.0.0-ci'
          docker run --rm --entrypoint ffmpeg bili-saver:ci -version
