services:
  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # 环境变量可覆盖 config.yaml 的任意字段，例如：
      # BILI_SAVER_TERITERI_ENABLED: "true"
      # BILI_SAVER_DOWNLOAD_QUALITY: "1080p"
      # BILI_SAVER_ADMIN_TOKEN: "改我"
      BILI_SAVER_LISTEN: ":8080"

  # 可选：teriteri-client 播放前端。不需要时删除此 service。
  web:
    build:
      context: .
      dockerfile: Dockerfile.teriteri
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - core
