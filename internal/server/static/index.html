<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bili-saver</title>
<script>(function(){try{var t=localStorage.getItem('bili-theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>
:root {
  --bg:#fafafa; --panel:#ffffff; --line:#e5e7eb; --line-strong:#d1d5db;
  --txt:#111827; --sub:#6b7280; --faint:#9ca3af;
  --accent:#fb7299; --accent-soft:#fdf2f5;
  --ok:#059669; --warn:#d97706; --err:#dc2626; --info:#2563eb;
  --th:#fcfcfd; --hover:#fafbfc; --btn-hov:#374151;
  --ok-bg:#f0fdf4; --ok-tx:#166534; --warn-bg:#fffbeb; --warn-tx:#92400e;
  --info-bg:#eff6ff; --info-tx:#1e40af;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:light;
}
html[data-theme="dark"] {
  --bg:#0f1115; --panel:#161a20; --line:#272c35; --line-strong:#39414d;
  --txt:#e5e9ef; --sub:#9aa4b2; --faint:#6b7480;
  --accent:#fb7299; --accent-soft:rgba(251,114,153,.16);
  --ok:#34d399; --warn:#fbbf24; --err:#f87171; --info:#60a5fa;
  --th:#1a1f26; --hover:#1c2129; --btn-hov:#d1d5db;
  --ok-bg:#122419; --ok-tx:#7dd8ac; --warn-bg:#2a2210; --warn-tx:#e0b45c;
  --info-bg:#14202e; --info-tx:#8ab8f0;
  color-scheme:dark;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body { font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); font-size:14px; -webkit-font-smoothing:antialiased; }
a { color:var(--info); text-decoration:none; }
a:hover { text-decoration:underline; }

.layout { display:grid; grid-template-columns:200px 1fr; min-height:100vh; }
aside { background:var(--panel); border-right:1px solid var(--line); padding:16px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand { padding:4px 20px 16px; font-size:15px; font-weight:700; letter-spacing:.2px; }
.brand span { color:var(--accent); }
nav { display:flex; flex-direction:column; gap:1px; }
nav button { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none;
  padding:8px 20px; font-size:13.5px; color:var(--sub); cursor:pointer; border-left:2px solid transparent; }
nav button:hover { background:var(--bg); color:var(--txt); }
nav button.active { color:var(--txt); font-weight:600; background:var(--accent-soft); border-left-color:var(--accent); }
nav .sec { padding:16px 20px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); }

main { padding:28px 36px; max-width:1180px; }
.pagehead { display:flex; align-items:baseline; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
.pagehead h1 { font-size:19px; font-weight:650; }
.pagehead .desc { color:var(--sub); font-size:13px; }
.pagehead .spacer { flex:1; }

.sect { margin-bottom:28px; }
.sect > h2 { font-size:13px; font-weight:600; color:var(--sub); padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:14px; letter-spacing:.02em; }

.statrow { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.stat { background:var(--panel); padding:14px 16px; }
.stat .num { font-size:22px; font-weight:650; font-variant-numeric:tabular-nums; }
.stat .num small { font-size:12px; color:var(--faint); font-weight:400; }
.stat .lab { font-size:12px; color:var(--sub); margin-top:2px; }

table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
th { text-align:left; font-size:12px; font-weight:500; color:var(--sub); padding:9px 12px; border-bottom:1px solid var(--line); background:var(--th); white-space:nowrap; }
td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
tr:last-child td { border-bottom:none; }
tbody tr:hover { background:var(--hover); }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
td.thumb img { width:64px; height:40px; object-fit:cover; border-radius:4px; display:block; background:var(--bg); }
.cell-sub { font-size:12px; color:var(--sub); margin-top:2px; }

.dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:1px; }
.dot.ok { background:var(--ok); } .dot.err { background:var(--err); } .dot.run { background:var(--info); }
.dot.queued { background:var(--faint); } .dot.warn { background:var(--warn); } .dot.off { background:var(--line-strong); }
.st { font-size:12.5px; color:var(--sub); white-space:nowrap; }

form { display:flex; flex-direction:column; gap:14px; max-width:680px; }
.field { display:flex; flex-direction:column; gap:5px; }
.field > label { font-size:12.5px; font-weight:500; color:var(--sub); }
.field .hint { font-size:12px; color:var(--faint); }
input[type=text],input[type=number],select {
  padding:7px 10px; border:1px solid var(--line-strong); border-radius:6px; font-size:13.5px; background:var(--panel); color:var(--txt); width:100%; }
input:focus,select:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
.inline { display:flex; gap:16px; flex-wrap:wrap; }
.inline .field { flex:1; min-width:130px; }
.check { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--txt); }

.btn { padding:7px 14px; border-radius:6px; font-size:13px; cursor:pointer; border:1px solid var(--line-strong); background:var(--panel); color:var(--txt); }
.btn:hover { background:var(--bg); }
.btn.primary { background:var(--txt); color:var(--panel); border-color:var(--txt); }
.btn.primary:hover { background:var(--btn-hov); border-color:var(--btn-hov); }
.btn.danger { color:var(--err); }
.btn.sm { padding:3px 9px; font-size:12px; }
.actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

.banner { padding:10px 14px; border-radius:8px; font-size:13px; line-height:1.6; margin-bottom:4px; }
.banner.ok { background:var(--ok-bg); color:var(--ok-tx); }
.banner.warn { background:var(--warn-bg); color:var(--warn-tx); }
.banner.info { background:var(--info-bg); color:var(--info-tx); }

.kv { display:grid; grid-template-columns:150px 1fr; gap:8px 16px; font-size:13px; }
.kv dt { color:var(--sub); }
.kv dd { font-variant-numeric:tabular-nums; }
code, .path { font-family:var(--mono); font-size:12px; background:var(--bg); padding:1px 5px; border-radius:4px; word-break:break-all; }
.pre { font-family:var(--mono); font-size:12px; color:var(--sub); white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px 12px; max-height:220px; overflow:auto; }

.spark { display:inline-flex; align-items:flex-end; gap:2px; height:48px; }
.spark i { width:7px; background:var(--faint); border-radius:1px; min-height:2px; }
.meta-note { font-size:12px; color:var(--faint); }
.tagtext { color:var(--sub); font-size:12.5px; }
.tagtext b { color:var(--txt); font-weight:500; }
.origin { font-size:11px; color:var(--faint); font-weight:400; }
mark { background:var(--accent-soft); color:var(--txt); padding:0 1px; border-radius:2px; }
.tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:14px; flex-wrap:wrap; }
.tabs button { border:none; background:none; padding:7px 12px; font-size:13px; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tabs button:hover { color:var(--txt); }
.tabs button.active { color:var(--txt); font-weight:600; border-bottom-color:var(--accent); }
.tabs .n { font-size:11px; color:var(--faint); margin-left:4px; font-weight:400; }
.pgn { display:flex; align-items:center; gap:12px; padding:10px 0 0; font-size:12.5px; color:var(--sub); }
.th-sort { cursor:pointer; user-select:none; white-space:nowrap; }
.th-sort:hover { color:var(--txt); }
.th-sort .arr { font-size:10px; color:var(--accent); }
.fgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px 28px; align-items:start; }
.fgrid .field { min-width:0; }
.fgrid .field input[type=number] { max-width:180px; }
.fgrid .wide { grid-column:1/-1; }
.fcheck { display:flex; align-items:flex-start; gap:8px; }
.fcheck input { margin-top:2px; }
.fcheck .fnote { display:block; font-size:12px; color:var(--faint); margin-top:2px; font-weight:400; }
.fchecks { display:flex; gap:6px 16px; flex-wrap:wrap; }
.fchecks .check { font-size:12.5px; border:1px solid var(--line-strong); border-radius:6px; padding:4px 10px; cursor:pointer; color:var(--sub); }
.fchecks .check:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); color:var(--txt); }
.field.dirty>label::after, .fcheck.dirty::after { content:" ●"; color:var(--accent); font-size:11px; vertical-align:2px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chips button { border:1px solid var(--line-strong); background:var(--panel); border-radius:6px; padding:4px 10px; font-size:12.5px; color:var(--sub); cursor:pointer; }
.chips button:hover { color:var(--txt); }
.chips button.on { border-color:var(--accent); background:var(--accent-soft); color:var(--txt); font-weight:500; }
.combo { display:flex; align-items:center; gap:8px; }
.fgrid .combo input[type=number] { width:110px; max-width:none; }
.combo .unit { font-size:12.5px; color:var(--sub); }
.stepper { display:inline-flex; align-items:center; border:1px solid var(--line-strong); border-radius:6px; overflow:hidden; }
.stepper button { width:32px; height:30px; border:none; background:var(--panel); font-size:15px; color:var(--sub); cursor:pointer; }
.stepper button:hover { background:var(--bg); color:var(--txt); }
.stepper input { width:54px; height:30px; text-align:center; border:none; border-left:1px solid var(--line); border-right:1px solid var(--line); border-radius:0; }
.stepper input:focus { outline:none; }
.switch { position:relative; width:36px; height:20px; flex:none; }
.switch input { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
.switch i { position:absolute; inset:0; background:var(--line-strong); border-radius:10px; transition:background .15s; pointer-events:none; }
.switch i::after { content:""; position:absolute; left:2px; top:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.18); }
.switch input:checked + i { background:var(--accent); }
.switch input:checked + i::after { transform:translateX(16px); }
.seg { display:inline-flex; border:1px solid var(--line-strong); border-radius:6px; overflow:hidden; width:100%; }
.seg button { flex:1; border:none; background:var(--panel); padding:6px 4px; font-size:12.5px; color:var(--sub); cursor:pointer; border-right:1px solid var(--line); white-space:nowrap; }
.seg button:last-child { border-right:none; }
.seg button:hover { color:var(--txt); }
.seg button.on { background:var(--txt); color:var(--panel); }
.msicon { width:18px; height:18px; fill:var(--sub); flex:none; }
.savebar { position:sticky; bottom:0; display:flex; gap:14px; align-items:center; padding:12px 16px;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-top:8px; box-shadow:0 -4px 14px rgba(0,0,0,.05); }
.dhead { display:flex; gap:20px; margin-bottom:24px; }
.dcover { width:168px; height:105px; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:var(--bg); flex:none; align-self:flex-start; }
.dhead h1 { font-size:18px; font-weight:650; line-height:1.45; }
.dmeta { display:flex; gap:6px 16px; flex-wrap:wrap; margin-top:8px; align-items:baseline; font-size:13px; }
.cmt { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
.cmt .face { width:32px; height:32px; border-radius:50%; flex:none; object-fit:cover; background:var(--bg); border:1px solid var(--line); }
.cmt .cbody { flex:1; min-width:0; }
.cmt .chead { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:12.5px; color:var(--sub); }
.cmt .chead b { font-weight:500; font-size:13px; color:var(--txt); }
.cmt .ccontent { font-size:13px; line-height:1.6; margin-top:3px; }
.backlink { display:inline-block; margin-bottom:14px; font-size:13px; }
.empty { padding:36px 0; text-align:center; color:var(--faint); font-size:13px; }
#toasts { position:fixed; right:20px; top:16px; z-index:100; display:flex; flex-direction:column; gap:8px; }
.toast { padding:10px 14px; border-radius:8px; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.10);
  background:var(--panel); border:1px solid var(--line); animation:tin .18s ease-out; max-width:340px; }
.toast.ok { border-left:3px solid var(--ok); } .toast.err { border-left:3px solid var(--err); }
.toast.info { border-left:3px solid var(--info); }
@keyframes tin { from{opacity:0; transform:translateX(12px)} to{opacity:1; transform:none} }
.pbar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; min-width:70px; }
.pbar i { display:block; height:100%; background:var(--info); transition:width .4s; }
.pbar.done i { background:var(--ok); }
.ratenum { font-size:17px; font-weight:650; font-variant-numeric:tabular-nums; }
nav button { position:relative; }
.navbadge { position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:var(--accent); color:#fff; font-size:10px; border-radius:8px; padding:1px 5px; font-weight:600; }
nav button.active .navbadge { background:var(--accent); }
@media (max-width:900px){ .layout{grid-template-columns:1fr;} aside{position:static;height:auto;} main{padding:20px;} }
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand"><span>bili</span>-saver</div>
  <nav id="nav">
    <div class="sec">管理</div>
    <button data-p="dash" class="active">总览</button>
    <button data-p="add">采集</button>
    <button data-p="videos">归档项目</button>
    <button data-p="search">搜索</button>
    <button data-p="sources">监控源</button>
    <button data-p="tracks">跟踪列表</button>
    <button data-p="libraries">媒体库</button>
    <div class="sec">系统</div>
    <button data-p="jobs">任务</button>
    <button data-p="logs">日志</button>
    <button data-p="login">账号</button>
    <button data-p="plugins">插件</button>
    <button data-p="settings">设置</button>
  </nav>
  <div style="padding:14px 12px 0"><button class="btn" id="themeToggle" style="width:100%">🌙 深色模式</button></div>
</aside>
<main id="main"></main>
<div id="toasts"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const api = (p, opt) => fetch('/api/v1'+p, opt).then(r => r.json().then(j => (r.ok ? j : Promise.reject(j.error||r.status))));
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = s => { s=+s; if(!s) return '—'; return new Date(s*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); };
const fmtN = n => n > 10000 ? (n/10000).toFixed(1)+'万' : (n ?? 0);
let page = 'dash', timer = null, recogSeq = 0;

function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast '+type; t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 320); }, 3500);
}
const fmtB = n => { n=+n||0; if(n<1024) return n+' B/s';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB/s';
  return (n/1024/1024).toFixed(2)+' MB/s'; };
const fmtBT = n => { n=+n||0; if(n<1024*1024) return (n/1024).toFixed(0)+' KB';
  if(n<1024*1024*1024) return (n/1024/1024).toFixed(1)+' MB';
  return (n/1024/1024/1024).toFixed(2)+' GB'; };

// 全局活动任务徽标（导航"任务"按钮）
let liveTimer = setInterval(async ()=>{
  try{
    const l = await fetch('/api/v1/live').then(r=>r.json());
    const n = (l.running||0)+(l.queued||0);
    const btn = document.querySelector('#nav button[data-p=jobs]');
    let b = btn.querySelector('.navbadge');
    if(n>0){ if(!b){ b=document.createElement('span'); b.className='navbadge'; btn.appendChild(b);} b.textContent=n; }
    else if(b) b.remove();
    window.__live = l;
  }catch(e){}
}, 4000);

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  if(window.__stGuard && !confirm('设置页有未保存的修改，离开将丢失。确定离开吗？')) return;
  window.__stGuard = false;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); page = b.dataset.p; clearInterval(timer); render();
});
window.switchPage = p => { document.querySelector(`#nav button[data-p=${p}]`).click(); };
window.addEventListener('beforeunload', e => {
  if(window.__stGuard){ e.preventDefault(); e.returnValue=''; }
});

/* 深色模式：localStorage 记忆，未设置时跟随系统 */
const applyTheme = t => {
  if(t){ document.documentElement.dataset.theme = t; } else { delete document.documentElement.dataset.theme; }
  try{ localStorage.setItem('bili-theme', t||''); }catch(e){}
  const b = document.getElementById('themeToggle');
  if(b) b.textContent = document.documentElement.dataset.theme==='dark' ? '☀️ 浅色模式' : '🌙 深色模式';
};
{
  const tb = document.getElementById('themeToggle');
  if(tb) tb.onclick = () => applyTheme(document.documentElement.dataset.theme==='dark' ? 'light' : 'dark');
  applyTheme(document.documentElement.dataset.theme || 'light');
}

async function render(){
  const m = $('#main');
  ({dash:renderDash, add:renderAdd, videos:renderVideos, search:renderSearch, sources:renderSources,
    tracks:renderTracks, libraries:renderLibraries, jobs:renderJobs, login:renderLogin, plugins:renderPlugins,
    settings:renderSettings, logs:renderLogs, mine:renderMine, users:renderUsers})[page](m);
}

/* ============ 总览 ============ */
async function renderDash(m){
  m.innerHTML = '<div class="empty">加载中…</div>';
  const [st, cfg, libs] = await Promise.all([api('/stats'), api('/config'), api('/libraries').catch(()=>[])]);
  m.innerHTML = `
  <div class="pagehead"><h1>总览</h1><span class="desc">归档规模与系统状态</span></div>
  <div class="sect"><h2>归档规模</h2>
    <div class="statrow">
      <div class="stat"><div class="num">${st.archive.videos}</div><div class="lab">视频</div></div>
      <div class="stat"><div class="num">${st.archive.downloaded}</div><div class="lab">已下载</div></div>
      <div class="stat"><div class="num">${st.archive.comments}<small> +${st.archive.deleted_comments} 消失</small></div><div class="lab">评论</div></div>
      <div class="stat"><div class="num">${st.archive.danmaku}</div><div class="lab">弹幕</div></div>
      <div class="stat"><div class="num">${st.archive.subtitles}</div><div class="lab">字幕</div></div>
      <div class="stat"><div class="num">${st.archive.snapshots}</div><div class="lab">原始快照</div></div>
      <div class="stat"><div class="num">${st.sources}</div><div class="lab">监控源</div></div>
    </div>
  </div>
  ${st.archive.videos===0?`<div class="sect"><h2>快速开始</h2><ol style="padding-left:20px;line-height:2;color:var(--sub);font-size:13.5px">
    <li>到 <a href="#" onclick="switchPage('add');return false">采集</a> 页粘贴一个视频链接或收藏夹，选择同步策略后提交</li>
    <li>在 <a href="#" onclick="switchPage('jobs');return false">任务</a> 页观察归档进度</li>
    <li>建议到 <a href="#" onclick="switchPage('login');return false">账号</a> 页扫码登录：解锁 UP 主源与评论消失检测</li>
  </ol></div>`:''}
  <div class="sect"><h2>实时</h2>
    <div class="statrow" id="liveRow">
      <div class="stat"><div class="num ratenum" id="lvDl">—</div><div class="lab">下载速率 <span class="meta-note" id="lvDlT"></span></div></div>
      <div class="stat"><div class="num ratenum" id="lvUl">—</div><div class="lab">上传速率 <span class="meta-note" id="lvUlT"></span></div></div>
      <div class="stat"><div class="num" id="lvRun">—</div><div class="lab">进行中任务</div></div>
      <div class="stat"><div class="num" id="lvQ">—</div><div class="lab">排队任务</div></div>
    </div>
    <div id="lvJobs" style="margin-top:10px"></div>
  </div>
  <div class="sect"><h2>系统</h2>
    <dl class="kv">
      <dt>B 站登录</dt><dd>${st.login?'<span class="dot ok"></span>已登录':'<span class="dot warn"></span>未登录 — 评论消失检测需要登录（账号页扫码）'}</dd>
      <dt>ffmpeg</dt><dd>${st.ffmpeg?'<span class="dot ok"></span>可用':'<span class="dot err"></span>不可用'}</dd>
    </dl>
  </div>

async function loadMediaServers(){
  const box = document.getElementById('msBox'); if(!box) return;
  const list = await fetch('/api/v1/media-servers/status').then(r=>r.json()).catch(()=>null);
  if(!box) return;
  const typeName = t => ({teriteri:'Teriteri', emby:'Emby', jellyfin:'Jellyfin', plex:'Plex', kodi:'Kodi'}[t]||t);
  if(!list || !list.length){ box.innerHTML = '<span class="meta-note">探测失败</span>'; return; }
  box.innerHTML = list.map(s=>{
    const dot = s.online ? '<span class="dot ok"></span>在线'
      : (s.detected ? '<span class="dot err"></span>离线' : '<span class="dot off"></span>未检测到');
    const lat = s.online && s.latency_ms ? ` · ${s.latency_ms}ms` : '';
    const inst = (s.instances||[]).map(i=>{
      const link = i.url ? `<a href="${esc(i.url)}" target="_blank">${esc(i.url)}</a>` : '<span class="meta-note">未配置地址</span>';
      return `<div class="meta-note" style="padding-left:14px">${esc(i.name||'')} · ${link} · ${esc(i.note||'')}</div>`;
    }).join('');
    return `<div style="padding:6px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="min-width:110px;display:flex;align-items:center;gap:8px">${msIcon(s.type)}<b style="font-weight:500">${esc(typeName(s.type))}</b></span>
        <span class="st" style="min-width:130px">${dot}${lat}</span>
        <span class="meta-note" style="flex:1">${esc(s.note||'')}</span>
      </div>
      ${inst}
    </div>`;
  }).join('');
}

async function updateLive(){
  const l = window.__live || await fetch('/api/v1/live').then(r=>r.json()).catch(()=>null);
  if(!l) return;
  const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  set('lvDl', fmtB(l.download_bps)); set('lvDlT', '累计 '+fmtBT(l.download_total));
  set('lvUl', fmtB(l.upload_bps));   set('lvUlT', '累计 '+fmtBT(l.upload_total));
  set('lvRun', l.running||0); set('lvQ', l.queued||0);

async function renderSrcHealth(){
  const box = document.getElementById('srcHealth'); if(!box) return;
  const cfg = await api('/config').catch(()=>null);
  const srcs = await api('/sources').catch(()=>[]);
  if(!srcs||!srcs.length){ box.innerHTML='<span class="meta-note">还没有监控源</span>'; return; }
  const defMin = cfg ? cfg.sync_default_minutes : 360;
  box.innerHTML = `<table><thead><tr><th>源</th><th>类型</th><th>模式</th><th>上次同步</th><th>下次同步</th><th></th></tr></thead><tbody>`+
    srcs.map(x=>{
      let next='—';
      if(!x.watch) next='<span class="meta-note">已暂停</span>';
      else if(x.sync_mode==='once') next = x.last_sync_at?'<span class="meta-note">已完成</span>':'首次待同步';
      else {
        const iv=(x.sync_interval_minutes||defMin)*60;
        next = x.last_sync_at ? fmtT(x.last_sync_at+iv) : '待首次同步';
      }
      return `<tr><td>${esc(x.title)}</td><td class="st">${esc(x.type)}</td>
        <td class="st">${x.watch?(x.sync_mode==='once'?'<span class="dot warn"></span>仅一次':'<span class="dot ok"></span>周期'):'<span class="dot off"></span>暂停'}</td>
        <td class="st">${fmtT(x.last_sync_at)}</td><td class="st">${next}</td>
        <td><button class="btn sm" onclick="syncSrc(${x.id})">同步</button></td></tr>`;
    }).join('')+'</tbody></table>';
}

let curType = '';
function syncHintText(type, mode){
  if(type==='video'){
    return mode==='once'
      ? '仅归档一次，之后不再跟踪（无消失检测）。单视频不涉及新视频触发器。'
      : '周期重同步：刷新播放量/统计并检测评论、弹幕消失。单视频不涉及新视频触发器。';
  }
  if(mode==='once'){
    return '仅一次：首次归档后自动停止监控——不再发现新视频，也不再刷新数据。';
  }
  return '按间隔周期刷新评论/弹幕/字幕与统计，并在此过程中发现新视频。'
    +'新视频是否自动下载由「新视频触发器」控制，可随时在监控源页调整；触发器关闭时新视频仍会归档数据，只是不下载文件。';
}
function updateSyncHint(){
  const el=$('#syncHint'); if(!el||!curType) return;
  const mode=$('#syncMode')?.value||'interval';
  el.textContent=syncHintText(curType, mode);
  el.style.color=(curType!=='video'&&mode==='once')?'var(--warn)':'';
}
function showTypeUI(type){
  curType=type;
  $('#baseOpts').style.display='flex';
  $('#watchLabel').textContent=WATCH_LABELS[type]||'监控';
  $('#dlLabel').textContent=DL_LABELS[type]||'下载视频文件';
  $('#typeOpts').style.display='block';
  $('#spaceOpts').style.display=type==='space'?'block':'none';
  if(type==='space') document.querySelectorAll('#spaceOpts .spScope').forEach(x=>x.checked=true);
  updateSyncHint();
}
function scopeChecked(rootSel){
  const total=document.querySelectorAll(rootSel+' .spScope').length;
  const toks=[...document.querySelectorAll(rootSel+' .spScope:checked')].map(x=>x.value);
  if(toks.length===0) return 'none';
  if(toks.length===total) return 'all';
  return toks.join(',');
}
async function recognizeInput(seq){
  const box=$('#recognize'), val=$('#inp').value.trim();
  if(!val){ box.innerHTML=''; curType=''; $('#baseOpts').style.display='none'; $('#typeOpts').style.display='none'; $('#spaceOpts').style.display='none'; return; }
  if(val.includes('b23.tv')){
    box.innerHTML='<div class="banner info">b23 短链 — 提交时自动展开识别</div>';
    showTypeUI('video'); return;
  }
  const r=await api('/resolve?input='+encodeURIComponent(val));
  if(seq!==recogSeq) return;
  const meta=TYPE_META[r.type];
  if(!r.ok||!meta){
    box.innerHTML=`<div class="banner warn">未识别 — ${esc(r.message||'请检查格式，或使用完整链接')}</div>`;
    $('#baseOpts').style.display='none'; $('#typeOpts').style.display='none'; return;
  }
  box.innerHTML=`<div class="banner ok"><b>${meta.name}</b> ${esc(r.ext_id)} — ${meta.hint}</div>`;
  showTypeUI(r.type);
}

let vSeq=0;
async function loadV(){
  const list=document.getElementById('list'); if(!list) return;
  const seq=++vSeq;
  list.innerHTML='<div class="empty">加载中…</div>';
  try{
    const qp=new URLSearchParams();
    if(vState) qp.set('status',vState);

    if(vQ) qp.set('q',vQ);
    qp.set('sort',vSort); qp.set('order',vOrder);
    qp.set('limit',V_PAGE); qp.set('offset',vOffset);
    const r=await api('/videos?'+qp);
    if(seq!==vSeq) return; // 已有更新的查询在途，丢弃过期响应
    const c=r.counts||{};
    vSetN('vN',r.total||0); vSetN('vNok',c.ok||0); vSetN('vNgone',c.gone||0); vSetN('vNprivate',c.private||0);
    const rb=document.getElementById('vreset'); if(rb) rb.style.display=(vState||vDl||vQ)?'':'none';

    const arr=col=> vSort===col ? (vOrder==='asc'?' <span class="arr">▲</span>':' <span class="arr">▼</span>') : '';
    list.innerHTML=`<table><thead><tr><th></th>
      <th class="th-sort" data-sort="title">项目${arr('title')}</th>
      <th class="th-sort" data-sort="pubdate">发布${arr('pubdate')}</th>

        <td class="st">${stTxt(v.status)}</td>

          <button class="btn sm" onclick="syncOne('${v.bvid}', this)">重同步</button>
          ${v.downloaded?'':`<button class="btn sm" onclick="dlVideo('${v.bvid}', this)">下载</button>`}

        </div></td></tr>`).join('')+'</tbody></table>';

  }
}

const hlTerms = (escaped, q) => {
  const terms = q.split(/\s+/).filter(Boolean).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if(!terms.length) return escaped;
  try{ return escaped.replace(new RegExp('('+terms.join('|')+')','gi'), '<mark>$1</mark>'); }
  catch(e){ return escaped; }
};

const ivTxt = v => v===-1?'从不':(v?v+'分':'跟随');
function seHints(){
  const mode=$('#seMode').value;
  $('#seModeHint').textContent = mode==='once'
    ? '仅一次：首次同步后自动停止监控，不再发现新视频或刷新数据'

    : (t==='1'?'发现新视频即自动下载并进跟踪列表':'新视频仅归档数据，不下载文件');

window.editSrc = id => api('/sources').then(srcs=>{

/* ============ 跟踪列表 ============ */
let tkState = '', tkQ = '', tkOffset = 0;
const TK_PAGE = 20;
async function renderTracks(m){
  m.innerHTML = `
  <div class="pagehead"><h1>跟踪列表</h1><span class="desc">监控源触发器发现的新视频，自动归档并下载一次</span></div>
  <div class="sect">
    <div class="tabs" id="tkTabs">
      <button data-st="">全部<span class="n" id="tkN"></span></button>
      <button data-st="done"><span class="dot ok"></span>已下载<span class="n" id="tkNdone"></span></button>
      <button data-st="queued"><span class="dot run"></span>排队中<span class="n" id="tkNqueued"></span></button>
      <button data-st="failed"><span class="dot err"></span>失败<span class="n" id="tkNfailed"></span></button>
    </div>
    <div class="actions" style="margin-bottom:12px">
      <input type="text" id="tkq" placeholder="搜索标题 / UP主 / BV号…" value="${esc(tkQ)}" style="max-width:260px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:6px;font-size:13.5px">
      <button class="btn" id="tkgo">搜索</button>
      <button class="btn" id="tkreset" style="display:${(tkState||tkQ)?'':'none'}">清除筛选</button>
    </div>
    <div id="tklist" class="empty">加载中…</div>
    <div class="pgn" id="tkpgn"></div>
  </div>`;
  document.querySelectorAll('#tkTabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.st===tkState);
    b.onclick = () => { tkState=b.dataset.st; tkOffset=0; loadTk(); };
  });
  const run = () => { tkQ=$('#tkq').value.trim(); tkOffset=0; loadTk(); };
  $('#tkgo').onclick = run;
  $('#tkq').onkeydown = e => { if(e.key==='Enter') run(); };
  const reset = $('#tkreset');
  if(reset) reset.onclick = () => { tkState=''; tkQ=''; tkOffset=0; renderTracks($('#main')); };
  await loadTk();
}
const tkSetN = (id, v) => { const el=document.getElementById(id); if(el) el.textContent=fmtN(v); };
let tkSeq=0;
async function loadTk(){
  const list=document.getElementById('tklist'); if(!list) return;
  const seq=++tkSeq;
  list.innerHTML='<div class="empty">加载中…</div>';
  try{
    const qp=new URLSearchParams();
    if(tkState) qp.set('state',tkState);
    if(tkQ) qp.set('q',tkQ);
    qp.set('limit',TK_PAGE); qp.set('offset',tkOffset);
    const r = await api('/tracks?'+qp);
    if(seq!==tkSeq) return; // 已有更新的查询在途，丢弃过期响应
    const c=r.counts||{};
    tkSetN('tkN', r.total||0); tkSetN('tkNdone', c.done||0); tkSetN('tkNqueued', c.queued||0); tkSetN('tkNfailed', c.failed||0);
    const rb=document.getElementById('tkreset');
    if(rb) rb.style.display=(tkState||tkQ)?'':'none';
    const items=r.items||[];
    const pg=document.getElementById('tkpgn');
    if(!items.length){
      list.innerHTML = `<div class="empty">${tkQ?'没有匹配的跟踪记录':(tkState==='failed'?'没有失败的跟踪记录':(tkState==='queued'?'没有排队中的记录':(tkState==='done'?'还没有已下载的跟踪记录':'暂无记录——在「监控源」的设置里开启「新视频触发器」，源内出现新视频时会自动下载并记录在这里')))}</div>`;
      pg.style.display='none'; return;
    }
    list.innerHTML = `<table><thead><tr><th>视频</th><th>UP主</th><th>来源</th><th>状态</th><th>发现时间</th></tr></thead><tbody>`+
      items.map(t=>{
        const st = t.state==='done' ? '<span class="dot ok"></span>已下载'
          : (t.state==='failed' ? '<span class="dot err"></span>失败' : '<span class="dot run"></span>排队/进行中');
        return `<tr>
        <td>${t.title?`<a href="#" onclick="openArchive('${t.bvid}');return false">${esc(t.title)}</a>`:'<b style="font-weight:500">（归档中）</b>'}
          <div class="cell-sub">${esc(t.bvid)}${t.downloaded?' · 文件在库':''}</div></td>
        <td class="st">${esc(t.owner_name)||'—'}</td>
        <td class="st">${t.source_id?(esc(t.source_title)||('源 #'+t.source_id)):'—'}</td>
        <td class="st">${st}${t.state==='failed'&&t.error?`<div class="cell-sub" style="color:var(--err);max-width:280px;white-space:normal">${esc(t.error)}</div>`:''}</td>
        <td class="st">${fmtT(t.created_at)}</td>
        </tr>`;
      }).join('')+'</tbody></table>';
    const pages = Math.max(1, Math.ceil((r.total||0)/TK_PAGE));
    const page = Math.floor(tkOffset/TK_PAGE)+1;
    if(pages<=1){ pg.style.display='none'; return; }
    pg.style.display='flex';
    pg.innerHTML = `<button class="btn sm" id="tkprev" ${page<=1?'disabled':''}>上一页</button>
      <span>第 ${page} / ${pages} 页 · 共 ${fmtN(r.total)} 条</span>
      <button class="btn sm" id="tknext" ${page>=pages?'disabled':''}>下一页</button>`;
    const prev=document.getElementById('tkprev'), next=document.getElementById('tknext');
    if(prev) prev.onclick = () => { tkOffset=(page-2)*TK_PAGE; loadTk(); };
    if(next) next.onclick = () => { tkOffset=page*TK_PAGE; loadTk(); };
  }catch(e){
    list.innerHTML = `<div class="banner warn">加载失败：${esc(String(e))}</div>`;
  }
}

window.saveLib = async () => {
  const id=$('#libEdit').dataset.id;
  const tags=$('#leTags').value.split(',').map(x=>x.trim()).filter(Boolean);
  const cats=$('#leCats').value.split(',').map(x=>x.trim()).filter(Boolean);
  const rules={};
  if(tags.length) rules.tags=tags;
  if(cats.length) rules.categories=cats;
  const ori=[...document.querySelectorAll('#libEdit .leOrient:checked')].map(x=>x.value);
  if(ori.length) rules.orientation=ori;
  const body={name:$('#leName').value.trim(), root_path:$('#leRoot').value.trim(),
    layout:$('#leLayout').value, link_mode:$('#leLink').value, metadata_format:$('#leMeta').value,
    match_rules:JSON.stringify(rules), enabled:$('#leEnabled').checked};
  if(!body.name||!body.root_path){ alert('名称与路径必填'); return; }
  try{
    if(id){ await api('/libraries/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    else { await api('/libraries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }

window.testRoute = async () => {

  out.textContent='测试中…';
  try{
    const d=await api('/libraries/route-test?bvid='+encodeURIComponent(bvid));
    const hit=(d.libraries||[]).filter(x=>x.matched).map(x=>x.name);
    const desc=(d.tname?('分区 '+d.tname):'')+(d.orientation?((d.tname?' · ':'')+(d.orientation==='vertical'?'竖屏':'横屏')):'');
    out.innerHTML=esc(d.bvid)+'（'+esc(desc||'未知属性')+'） → '+(hit.length?'命中库：'+esc(hit.join('、')):'无命中的启用库');
  }catch(e){ out.textContent='失败：'+e; }

/* ============ 任务 ============ */
const JOB_TYPE_CN={sync_source:'源同步',archive:'归档',download:'视频下载',touch_stats:'统计刷新',sync_stats_all:'全库统计',fetch_images:'图片补档',fetch_levels:'等级补档'};
const JOB_STATE_CN={queued:'排队中',running:'执行中',done:'已完成',failed:'失败'};
let jobFilter='';
async function renderJobs(m){
  const js=await api('/jobs?limit=100');
  const shown=(js||[]).filter(j=>!jobFilter||j.state===jobFilter);
  const tabs=[['','全部'],['running','执行中'],['queued','排队中'],['done','已完成'],['failed','失败']];
  m.innerHTML=`
  <div class="pagehead"><h1>任务</h1><span class="desc">队列与执行状态</span>
    <span class="spacer"></span><button class="btn" onclick="syncNow()">全部同步</button></div>
  <div class="sect">
    <div class="tabs" style="margin-bottom:12px" id="jobTabs">
      ${tabs.map(([v,t])=>`<button data-st="${v}" class="${jobFilter===v?'active':''}">${t}</button>`).join('')}
    </div>
    ${shown.length?`<table><thead><tr><th class="num">#</th><th>类型</th><th>任务来源</th><th>状态</th><th style="min-width:110px">进度</th><th>详情</th><th>时间</th><th></th></tr></thead><tbody>`+
    shown.map(j=>{
      const dot={done:'ok',failed:'err',running:'run',queued:'queued'}[j.state]||'off';
      const ts=(j.state==='running'||j.state==='queued')&&j.updated_at?j.updated_at:j.created_at;
      const src=j.source||'系统任务';
      return `<tr><td class="num">${j.id}</td>
      <td class="st">${JOB_TYPE_CN[j.type]||esc(j.type)}</td>
      <td class="st" style="max-width:260px" title="${esc(src)}">${esc(src)}</td>
      <td class="st"><span class="dot ${dot}"></span>${JOB_STATE_CN[j.state]||j.state}</td>
      <td><div class="pbar ${j.state==='done'?'done':''}"><i style="width:${Math.max(2,Math.round(j.progress*100))}%"></i></div><span class="meta-note">${Math.round(j.progress*100)}%</span></td>
      <td class="st" style="max-width:200px">${esc(j.detail||j.error).slice(0,60)}</td>
      <td class="st">${fmtT(ts)}</td>
      <td>${j.state==='failed'?`<button class="btn sm" onclick="retryJob(${j.id})">重试</button>`:''}</td></tr>`;}).join('')+'</tbody></table>':'<div class="empty">该状态暂无任务</div>'}
  </div>`;
  document.querySelectorAll('#jobTabs button').forEach(b=>b.onclick=()=>{jobFilter=b.dataset.st; renderJobs(m);});
  clearInterval(timer);
  const hasActive = (js||[]).some(j=>j.state==='running'||j.state==='queued');
  if(hasActive){ // 仅存在活动任务时轮询；保持滚动位置避免闪烁
    const y = window.scrollY;
    timer=setInterval(async()=>{ if(page!=='jobs'){clearInterval(timer);return;}
      await renderJobs(m); window.scrollTo(0,y); }, 3000);
  }
}
window.retryJob = async id => { try{ await api(`/jobs/${id}/retry`,{method:'POST'}); toast('任务 #'+id+' 已重新入队','ok'); renderJobs($('#main')); }catch(e){ toast('重试失败：'+e,'err'); } };
window.syncNow = async () => { try{ const r=await api('/sync-now',{method:'POST'}); toast('已排队 '+r.queued+' 个源','ok'); renderJobs($('#main')); }catch(e){ toast('失败：'+e,'err'); } };

/* ============ 日志 ============ */
let logLastSeq=0, logLevel='', logTimer=null;
async function renderLogs(m){
  m.innerHTML=`
  <div class="pagehead"><h1>日志</h1><span class="desc">服务运行日志（内存保留最近约 4000 行；按日全量落盘 data/logs/，可导出）</span>
    <span class="spacer"></span><label class="check"><input type="checkbox" id="logFollow" checked> 实时刷新</label></div>
  <div class="sect">
    <div class="actions" style="margin-bottom:10px;align-items:center">
      <div class="tabs" id="logTabs">
        <button data-lv="" class="active">全部</button>
        <button data-lv="INFO">信息</button>
        <button data-lv="WARN">警告</button>
        <button data-lv="ERROR">错误</button>
      </div>
      <span class="meta-note">导出范围</span>
      <input type="date" id="logFrom" style="padding:5px 8px;border:1px solid var(--line-strong);border-radius:6px">
      <span class="meta-note">至</span>
      <input type="date" id="logTo" style="padding:5px 8px;border:1px solid var(--line-strong);border-radius:6px">
      <button class="btn sm" onclick="exportLogs()">导出日志</button>
    </div>
    <div id="logBox" style="background:#111827;color:#d1d5db;font-family:var(--mono);font-size:12px;line-height:1.55;border-radius:8px;padding:10px 12px;height:560px;overflow:auto;white-space:pre-wrap;word-break:break-all"><div class="empty" style="color:#64748b">加载中…</div></div>
  </div>`;
  logLastSeq=0; logLevel='';
  document.querySelectorAll('#logTabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#logTabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); logLevel=b.dataset.lv;
    logLastSeq=0; document.getElementById('logBox').innerHTML='<div class="empty" style="color:#64748b">加载中…</div>';
    pollLogs();
  });
  document.getElementById('logFollow').onchange=e=>{ if(e.target.checked) pollLogs(); };
  clearInterval(logTimer);
  logTimer=setInterval(async()=>{ if(page!=='logs'){clearInterval(logTimer);return;}
    if(document.getElementById('logFollow')?.checked) pollLogs(); },2000);
  await pollLogs();
}
async function pollLogs(){
  const box=document.getElementById('logBox'); if(!box) return;
  try{
    const d=await api('/logs?after='+logLastSeq+'&level='+(logLevel||''));
    if(box.querySelector('.empty')) box.innerHTML='';
    if(d.lines&&d.lines.length){
      const frag=document.createDocumentFragment();
      for(const l of d.lines){
        const div=document.createElement('div');
        const lv=(l.text.match(/level=(\w+)/)||[])[1]||'INFO';
        const col={WARN:'#fbbf24',ERROR:'#f87171',DEBUG:'#94a3b8'}[lv]||'#93c5fd';
        const msg=l.text.replace(/^time=[^ ]+ /,'').replace(/^level=\w+ /,'').replace(/ level=\w+ /g,' ');
        div.innerHTML='<span style="color:#64748b">'+esc(l.ts)+'</span> <span style="color:'+col+';font-weight:600">['+lv+']</span> '+esc(msg);
        frag.appendChild(div);
      }
      box.appendChild(frag);
      while(box.childNodes.length>1200) box.removeChild(box.firstChild);
      if(document.getElementById('logFollow')?.checked) box.scrollTop=box.scrollHeight;
    }else if(logLastSeq===0){
      box.innerHTML='<div class="empty" style="color:#64748b">暂无日志</div>';
    }
    logLastSeq=d.latest||logLastSeq;
  }catch(e){}
}
function exportLogs(){
  const f=document.getElementById('logFrom')?.value||'';
  const t=document.getElementById('logTo')?.value||'';
  window.open('/api/v1/logs/export?from='+encodeURIComponent(f)+'&to='+encodeURIComponent(t)+'&level='+encodeURIComponent(logLevel||''));
}

      <div style="flex:1;max-width:340px">

window.logoutBili = async switchAcc => {
  const tip = switchAcc ? '切换账号：将退出当前登录并显示新二维码，确认？' : '退出当前 B 站登录？';
  if(!confirm(tip)) return;

};

/* ============ 设置 ============ */
const QUAL_OPTS = ['4k','1080p60','1080p-high','1080p','720p60','720p','480p','360p'];
const AQUAL_OPTS = ['hires','dolby','192k','132k','64k'];
const ST_FIELDS = [
  ['stSyncMin','sync_default_minutes','int'], ['stStatsH','stats_resync_hours','int'],
  ['stAdaptive','adaptive_sync','bool'], ['stCmtMax','comments_max','int'],
  ['stSubMax','sub_replies_max','int'], ['stFullCmt','full_resync_comments','bool'],
  ['stHotV','hot_video_views','int'], ['stHotR','hot_video_replies','int'],
  ['stAutoDl','auto_download','bool'], ['stDlDm','download_danmaku','bool'],
  ['stConc','concurrency','int1'], ['stSeg','segments','int1'],
  ['stAv1','allow_av1','bool'], ['st4k','allow_4k','bool'], ['stMinReq','min_req_ms','int'],
  ['stMedEn','media_enabled','bool'], ['stMedLayout','media_layout','seg'],
  ['stMedLink','media_link_mode','seg'], ['stPubUrl','media_public_url','str'],
  ['stTeriEn','teriteri_enabled','bool'], ['stFrontUrl','frontend_url','str'],
];
const ST_COMBOS = [
  {id:'stSyncMin', unit:'分钟', presets:[[15,'15 分钟'],[30,'30 分钟'],[60,'1 小时'],[180,'3 小时'],[360,'6 小时'],[720,'12 小时'],[1440,'每天']]},
  {id:'stStatsH',  unit:'小时', presets:[[0,'禁用'],[1,'1 小时'],[2,'2 小时'],[6,'6 小时'],[12,'12 小时'],[24,'24 小时']]},
  {id:'stCmtMax',  unit:'条',   presets:[[0,'不限'],[200,'200'],[500,'500'],[1000,'1000'],[2000,'2000']]},
  {id:'stSubMax',  unit:'条',   presets:[[0,'不限'],[50,'50'],[100,'100'],[200,'200']]},
  {id:'stHotV',    unit:'',     presets:[[0,'禁用'],[100000,'10万'],[500000,'50万'],[1000000,'100万'],[2000000,'200万'],[5000000,'500万']]},
  {id:'stHotR',    unit:'',     presets:[[0,'禁用'],[1000,'1000'],[5000,'5000'],[10000,'1万'],[50000,'5万']]},
];
const ST_STEPPERS = ['stConc','stSeg'];
const stSyncCombos = () => {
  for(const cb of ST_COMBOS){
    const n=document.getElementById(cb.id), box=document.getElementById(cb.id+'Box');
    if(!n||!box) continue;
    const v=+n.value||0;
    box.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on', +b.dataset.v===v));
  }
};
let stInit = null;
const stChecks = (prefix, vals) => {
  const cur = vals||[];
  const all = [...new Set([...(prefix==='stQ_'?QUAL_OPTS:AQUAL_OPTS), ...cur])];
  return all.map(v=>`<label class="check"><input type="checkbox" id="${prefix}${v}" data-v="${esc(v)}" ${cur.includes(v)?'checked':''}> ${esc(v)}</label>`).join('');
};
const stCollect = () => {
  const o = { qualities: [], audio_qualities: [] };
  for(const [id,k,t] of ST_FIELDS){
    const el = document.getElementById(id); if(!el) continue;
    if(t==='bool') o[k]=el.checked;
    else if(t==='int') o[k]=Math.max(0,+el.value||0);
    else if(t==='int1') o[k]=Math.max(1,+el.value||1);
    else if(t==='seg'){ const on=el.querySelector('.on'); o[k]=on?on.dataset.v:''; }
    else o[k]=el.value.trim();
  }
  document.querySelectorAll('[id^="stQ_"]').forEach(x=>{ if(x.checked) o.qualities.push(x.dataset.v); });
  document.querySelectorAll('[id^="stAQ_"]').forEach(x=>{ if(x.checked) o.audio_qualities.push(x.dataset.v); });
  return o;
};
let stSeq = 0;
const stRefresh = () => {
  if(stInit===null) return;
  stSyncCombos();
  const cur = stCollect(), diffKeys = [];
  for(const [id,k] of ST_FIELDS){
    const changed = JSON.stringify(cur[k])!==JSON.stringify(stInit[k]);
    if(changed) diffKeys.push(k);
    const el = document.getElementById(id);
    const box = el && el.closest('.field,.fcheck');
    if(box) box.classList.toggle('dirty', changed);
  }
  const qChanged = JSON.stringify(cur.qualities)!==JSON.stringify(stInit.qualities);
  const aChanged = JSON.stringify(cur.audio_qualities)!==JSON.stringify(stInit.audio_qualities);
  if(qChanged) diffKeys.push('qualities');
  if(aChanged) diffKeys.push('audio_qualities');
  const qb=document.getElementById('stQualsBox'), ab=document.getElementById('stAudioQBox');
  if(qb) qb.classList.toggle('dirty', qChanged);
  if(ab) ab.classList.toggle('dirty', aChanged);
  const n = diffKeys.length;
  window.__stGuard = n>0;
  const dirtyEls=[document.getElementById('stDirty'),document.getElementById('stDirty2')];
  dirtyEls.forEach(el=>{ if(!el) return; el.textContent = n>0 ? `未保存修改 ${n} 项 · 离开页面将丢失` : ''; el.style.display = n>0?'':'none'; });
  ['stSave','stSave2'].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled = n===0; });
  ['stReset','stReset2'].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display = n>0?'':'none'; });
};
const stApply = snap => {
  for(const [id,k,t] of ST_FIELDS){
    const el=document.getElementById(id); if(!el) continue;
    if(t==='bool') el.checked=!!snap[k];
    else if(t==='seg') el.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===snap[k]));
    else el.value=snap[k];
  }
  document.querySelectorAll('[id^="stQ_"]').forEach(x=>x.checked=snap.qualities.includes(x.dataset.v));
  document.querySelectorAll('[id^="stAQ_"]').forEach(x=>x.checked=snap.audio_qualities.includes(x.dataset.v));
  stSyncCombos();
  stRefresh();
};

  <div id="setOut"></div>
  <div class="sect"><h2>采集与补档</h2>
    <div class="fgrid">
      ${comboF(ST_COMBOS[0],'监控源默认同步间隔','源未单独设置间隔时使用；可直接输入任意分钟',c.sync_default_minutes)}
      ${comboF(ST_COMBOS[1],'全库统计周期','定时刷新全库播放/点赞等统计数值',c.stats_resync_hours??0)}

      const n = document.getElementById(chip.closest('.chips').dataset.for);

      return;

function buildNav(){
  const me=window.ME||{role:'anon'};
  const nav=document.getElementById('nav');
  if(!nav) return;
  if(me.role==='admin' && !document.querySelector('[data-p=users]')){
    const b=document.createElement('button');
    b.dataset.p='users'; b.textContent='用户管理';
    document.querySelector('#nav').appendChild(b);
  }
  if(me.role==='user'){
    document.querySelectorAll('#nav button').forEach(b=>{ if(b.dataset.p!=='mine') b.style.display='none'; });
    if(!document.querySelector('[data-p=mine]')){
      const b=document.createElement('button');
      b.dataset.p='mine'; b.className='active'; b.textContent='我的补档';
      nav.insertBefore(b, nav.firstChild.nextSibling);
    }
    document.querySelectorAll('#nav button').forEach(b=>{ b.style.display = b.dataset.p==='mine'?'':'none'; });
  }
  if(me.role!=='anon' && !document.getElementById('logoutBtn')){
    const btn=document.createElement('button');
    btn.id='logoutBtn'; btn.textContent='退出登录（'+(me.username||'')+'）';
    btn.style.margin='16px 20px 0'; btn.style.width='calc(100% - 40px)'; btn.style.textAlign='left';
    btn.onclick=async()=>{ await fetch('/api/v1/auth/logout',{method:'POST'}); location.reload(); };
    nav.after(btn);
  }
}

async function mineAdd(){

    const r=await api('/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      input:v, watch:document.getElementById('mWatch').checked, sync_mode:'interval',
      interval_minutes:+(document.getElementById('mIv').value)||0})});

    renderMine($('#main'));
  }catch(e){ out.textContent='失败：'+e; }

      <div class="meta-note" style="margin-top:4px">${esc(inst.step||'')} · ${Math.round((inst.progress||0)*100)}%</div>
      <pre style="margin-top:6px;max-height:150px;overflow:auto;background:var(--bg);padding:8px;border-radius:8px;font-size:12px;white-space:pre-wrap">${esc((inst.logs||[]).join(String.fromCharCode(10)))}</pre>`
    : inst.error?`<div class="meta-note" style="color:var(--err);margin-top:6px">上次安装失败：${esc(inst.error)}</div>`:''}
    <div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn" ${inst.running?'disabled':''} onclick="teriteriInstall()">${inst.running?'安装中…':(s.client_ready||s.admin_ready?'重新构建多端':'一键安装（克隆 + npm 构建）')}</button>
      <span class="meta-note">需系统 git 与 Node.js；完成后由核心自动托管，API/媒体/弹幕 WS 进程内直通</span>
    </div>`;
  if(window.__teriTimer) clearInterval(window.__teriTimer);
  if(inst.running){ window.__teriTimer = setInterval(()=>{ if(page!=='dash') clearInterval(window.__teriTimer); else loadTeriteri(); }, 2000); }
}
async function teriteriInstall(){
  try{
    const r = await fetch('/api/v1/teriteri/install', {method:'POST'});
    if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error || ('HTTP '+r.status)); }
  }catch(e){ alert('启动安装失败: '+e.message); }
  loadTeriteri();
}
</script>
