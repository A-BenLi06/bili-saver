<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bili-saver</title>
<style>
:root {
  --bg:#fafafa; --panel:#ffffff; --line:#e5e7eb; --line-strong:#d1d5db;
  --txt:#111827; --sub:#6b7280; --faint:#9ca3af;
  --accent:#fb7299; --accent-soft:#fdf2f5;
  --ok:#059669; --warn:#d97706; --err:#dc2626; --info:#2563eb;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body { font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); font-size:14px; -webkit-font-smoothing:antialiased; }
a { color:var(--info); text-decoration:none; }
a:hover { text-decoration:underline; }

.layout { display:grid; grid-template-columns:200px 1fr; min-height:100vh; }
aside { background:var(--panel); border-right:1px solid var(--line); padding:16px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand { padding:4px 20px 16px; font-size:15px; font-weight:700; letter-spacing:.2px; }
.brand span { color:var(--accent); }
nav { display:flex; flex-direction:column; gap:1px; }
nav button { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none;
  padding:8px 20px; font-size:13.5px; color:var(--sub); cursor:pointer; border-left:2px solid transparent; }
nav button:hover { background:var(--bg); color:var(--txt); }
nav button.active { color:var(--txt); font-weight:600; background:var(--accent-soft); border-left-color:var(--accent); }
nav .sec { padding:16px 20px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); }

main { padding:28px 36px; max-width:1180px; }
.pagehead { display:flex; align-items:baseline; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
.pagehead h1 { font-size:19px; font-weight:650; }
.pagehead .desc { color:var(--sub); font-size:13px; }
.pagehead .spacer { flex:1; }

.sect { margin-bottom:28px; }
.sect > h2 { font-size:13px; font-weight:600; color:var(--sub); padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:14px; letter-spacing:.02em; }

.statrow { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.stat { background:var(--panel); padding:14px 16px; }
.stat .num { font-size:22px; font-weight:650; font-variant-numeric:tabular-nums; }
.stat .num small { font-size:12px; color:var(--faint); font-weight:400; }
.stat .lab { font-size:12px; color:var(--sub); margin-top:2px; }

table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
th { text-align:left; font-size:12px; font-weight:500; color:var(--sub); padding:9px 12px; border-bottom:1px solid var(--line); background:#fcfcfd; white-space:nowrap; }
td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
tr:last-child td { border-bottom:none; }
tbody tr:hover { background:#fafbfc; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
td.thumb img { width:64px; height:40px; object-fit:cover; border-radius:4px; display:block; background:var(--bg); }
.cell-sub { font-size:12px; color:var(--sub); margin-top:2px; }

.dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:1px; }
.dot.ok { background:var(--ok); } .dot.err { background:var(--err); } .dot.run { background:var(--info); }
.dot.queued { background:var(--faint); } .dot.warn { background:var(--warn); } .dot.off { background:#d1d5db; }
.st { font-size:12.5px; color:var(--sub); white-space:nowrap; }

form { display:flex; flex-direction:column; gap:14px; max-width:680px; }
.field { display:flex; flex-direction:column; gap:5px; }
.field > label { font-size:12.5px; font-weight:500; color:var(--sub); }
.field .hint { font-size:12px; color:var(--faint); }
input[type=text],input[type=number],select {
  padding:7px 10px; border:1px solid var(--line-strong); border-radius:6px; font-size:13.5px; background:var(--panel); color:var(--txt); width:100%; }
input:focus,select:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
.inline { display:flex; gap:16px; flex-wrap:wrap; }
.inline .field { flex:1; min-width:130px; }
.check { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--txt); }

.btn { padding:7px 14px; border-radius:6px; font-size:13px; cursor:pointer; border:1px solid var(--line-strong); background:var(--panel); color:var(--txt); }
.btn:hover { background:var(--bg); }
.btn.primary { background:var(--txt); color:#fff; border-color:var(--txt); }
.btn.primary:hover { background:#374151; }
.btn.danger { color:var(--err); }
.btn.sm { padding:3px 9px; font-size:12px; }
.actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

.banner { padding:10px 14px; border-radius:8px; font-size:13px; line-height:1.6; margin-bottom:4px; }
.banner.ok { background:#f0fdf4; color:#166534; }
.banner.warn { background:#fffbeb; color:#92400e; }
.banner.info { background:#eff6ff; color:#1e40af; }

.kv { display:grid; grid-template-columns:150px 1fr; gap:8px 16px; font-size:13px; }
.kv dt { color:var(--sub); }
.kv dd { font-variant-numeric:tabular-nums; }
code, .path { font-family:var(--mono); font-size:12px; background:var(--bg); padding:1px 5px; border-radius:4px; word-break:break-all; }
.pre { font-family:var(--mono); font-size:12px; color:var(--sub); white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px 12px; max-height:220px; overflow:auto; }

.spark { display:inline-flex; align-items:flex-end; gap:2px; height:36px; }
.spark i { width:7px; background:var(--faint); border-radius:1px; min-height:2px; }
.meta-note { font-size:12px; color:var(--faint); }
.tagtext { color:var(--sub); font-size:12.5px; }
.tagtext b { color:var(--txt); font-weight:500; }
.origin { font-size:11px; color:var(--faint); font-weight:400; }
mark { background:var(--accent-soft); color:var(--txt); padding:0 1px; border-radius:2px; }
.tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:14px; flex-wrap:wrap; }
.tabs button { border:none; background:none; padding:7px 12px; font-size:13px; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tabs button:hover { color:var(--txt); }
.tabs button.active { color:var(--txt); font-weight:600; border-bottom-color:var(--accent); }
.tabs .n { font-size:11px; color:var(--faint); margin-left:4px; font-weight:400; }
.pgn { display:flex; align-items:center; gap:12px; padding:10px 0 0; font-size:12.5px; color:var(--sub); }
.th-sort { cursor:pointer; user-select:none; white-space:nowrap; }
.th-sort:hover { color:var(--txt); }
.th-sort .arr { font-size:10px; color:var(--accent); }
.backlink { display:inline-block; margin-bottom:14px; font-size:13px; }
.empty { padding:36px 0; text-align:center; color:var(--faint); font-size:13px; }
#toasts { position:fixed; right:20px; top:16px; z-index:100; display:flex; flex-direction:column; gap:8px; }
.toast { padding:10px 14px; border-radius:8px; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.10);
  background:var(--panel); border:1px solid var(--line); animation:tin .18s ease-out; max-width:340px; }
.toast.ok { border-left:3px solid var(--ok); } .toast.err { border-left:3px solid var(--err); }
.toast.info { border-left:3px solid var(--info); }
@keyframes tin { from{opacity:0; transform:translateX(12px)} to{opacity:1; transform:none} }
.pbar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; min-width:70px; }
.pbar i { display:block; height:100%; background:var(--info); transition:width .4s; }
.pbar.done i { background:var(--ok); }
.ratenum { font-size:17px; font-weight:650; font-variant-numeric:tabular-nums; }
nav button { position:relative; }
.navbadge { position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:var(--accent); color:#fff; font-size:10px; border-radius:8px; padding:1px 5px; font-weight:600; }
nav button.active .navbadge { background:var(--accent); }
@media (max-width:900px){ .layout{grid-template-columns:1fr;} aside{position:static;height:auto;} main{padding:20px;} }
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand"><span>bili</span>-saver</div>
  <nav id="nav">
    <div class="sec">管理</div>
    <button data-p="dash" class="active">总览</button>
    <button data-p="add">采集</button>
    <button data-p="videos">归档项目</button>
    <button data-p="search">搜索</button>
    <button data-p="sources">监控源</button>
    <button data-p="tracks">跟踪列表</button>
    <button data-p="libraries">媒体库</button>
    <div class="sec">系统</div>
    <button data-p="jobs">任务</button>
    <button data-p="login">账号</button>
    <button data-p="plugins">插件</button>
    <button data-p="settings">设置</button>
  </nav>
</aside>
<main id="main"></main>
<div id="toasts"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const api = (p, opt) => fetch('/api/v1'+p, opt).then(r => r.json().then(j => (r.ok ? j : Promise.reject(j.error||r.status))));
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = s => { s=+s; if(!s) return '—'; return new Date(s*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); };
const fmtN = n => n > 10000 ? (n/10000).toFixed(1)+'万' : (n ?? 0);
let page = 'dash', timer = null, recogSeq = 0;

function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast '+type; t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 320); }, 3500);
}
const fmtB = n => { n=+n||0; if(n<1024) return n+' B/s';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB/s';
  return (n/1024/1024).toFixed(2)+' MB/s'; };
const fmtBT = n => { n=+n||0; if(n<1024*1024) return (n/1024).toFixed(0)+' KB';
  if(n<1024*1024*1024) return (n/1024/1024).toFixed(1)+' MB';
  return (n/1024/1024/1024).toFixed(2)+' GB'; };

// 全局活动任务徽标（导航"任务"按钮）
let liveTimer = setInterval(async ()=>{
  try{
    const l = await fetch('/api/v1/live').then(r=>r.json());
    const n = (l.running||0)+(l.queued||0);
    const btn = document.querySelector('#nav button[data-p=jobs]');
    let b = btn.querySelector('.navbadge');
    if(n>0){ if(!b){ b=document.createElement('span'); b.className='navbadge'; btn.appendChild(b);} b.textContent=n; }
    else if(b) b.remove();
    window.__live = l;
  }catch(e){}
}, 4000);

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); page = b.dataset.p; clearInterval(timer); render();
});
window.switchPage = p => { document.querySelector(`#nav button[data-p=${p}]`).click(); };

async function render(){
  const m = $('#main');
  ({dash:renderDash, add:renderAdd, videos:renderVideos, search:renderSearch, sources:renderSources,
    tracks:renderTracks, libraries:renderLibraries, jobs:renderJobs, login:renderLogin, plugins:renderPlugins,
    settings:renderSettings})[page](m);
}

/* ============ 总览 ============ */
async function renderDash(m){
  m.innerHTML = '<div class="empty">加载中…</div>';
  const [st, cfg, libs] = await Promise.all([api('/stats'), api('/config'), api('/libraries').catch(()=>[])]);
  m.innerHTML = `
  <div class="pagehead"><h1>总览</h1><span class="desc">归档规模与系统状态</span></div>
  <div class="sect"><h2>归档规模</h2>
    <div class="statrow">
      <div class="stat"><div class="num">${st.archive.videos}</div><div class="lab">视频</div></div>
      <div class="stat"><div class="num">${st.archive.downloaded}</div><div class="lab">已下载</div></div>
      <div class="stat"><div class="num">${st.archive.comments}<small> +${st.archive.deleted_comments} 消失</small></div><div class="lab">评论</div></div>
      <div class="stat"><div class="num">${st.archive.danmaku}</div><div class="lab">弹幕</div></div>
      <div class="stat"><div class="num">${st.archive.subtitles}</div><div class="lab">字幕</div></div>
      <div class="stat"><div class="num">${st.archive.snapshots}</div><div class="lab">原始快照</div></div>
      <div class="stat"><div class="num">${st.sources}</div><div class="lab">监控源</div></div>
    </div>
  </div>
  ${st.archive.videos===0?`<div class="sect"><h2>快速开始</h2><ol style="padding-left:20px;line-height:2;color:var(--sub);font-size:13.5px">
    <li>到 <a href="#" onclick="switchPage('add');return false">采集</a> 页粘贴一个视频链接或收藏夹，选择同步策略后提交</li>
    <li>在 <a href="#" onclick="switchPage('jobs');return false">任务</a> 页观察归档进度</li>
    <li>建议到 <a href="#" onclick="switchPage('login');return false">账号</a> 页扫码登录：解锁 UP 主源与评论消失检测</li>
  </ol></div>`:''}
  <div class="sect"><h2>实时</h2>
    <div class="statrow" id="liveRow">
      <div class="stat"><div class="num ratenum" id="lvDl">—</div><div class="lab">下载速率 <span class="meta-note" id="lvDlT"></span></div></div>
      <div class="stat"><div class="num ratenum" id="lvUl">—</div><div class="lab">上传速率 <span class="meta-note" id="lvUlT"></span></div></div>
      <div class="stat"><div class="num" id="lvRun">—</div><div class="lab">进行中任务</div></div>
      <div class="stat"><div class="num" id="lvQ">—</div><div class="lab">排队任务</div></div>
    </div>
    <div id="lvJobs" style="margin-top:10px"></div>
  </div>
  <div class="sect"><h2>系统</h2>
    <dl class="kv">
      <dt>B 站登录</dt><dd>${st.login?'<span class="dot ok"></span>已登录':'<span class="dot warn"></span>未登录 — 评论消失检测需要登录（账号页扫码）'}</dd>
      <dt>ffmpeg</dt><dd>${st.ffmpeg?'<span class="dot ok"></span>可用':'<span class="dot err"></span>不可用'}</dd>
    </dl>
  </div>
  <div class="sect"><h2>源健康</h2><div id="srcHealth"><span class="meta-note">加载中…</span></div></div>
  <div class="sect"><h2>第三方媒体库在线</h2><div id="msBox"><span class="meta-note">探测中…</span></div></div>
  <div class="sect"><h2>TeriTeri 多端（播放站 / 审核台）</h2><div id="teriBox"><span class="meta-note">加载中…</span></div></div>
  <div class="sect"><h2>观看渠道</h2>
    <dl class="kv">
      <dt>teriteri 前端</dt><dd>${cfg.frontend_url?`<a href="${esc(cfg.frontend_url)}" target="_blank">${esc(cfg.frontend_url)}</a>`:'未部署 · 可在上方一键安装，或 <span class="meta-note">deploy/docker-compose.yml 的 web 服务</span>'}</dd>
      <dt>媒体库</dt><dd>${(libs||[]).filter(l=>l.enabled).length} 个已启用 · <a href="#" onclick="switchPage('libraries');return false">管理</a></dd>
      <dt>内置播放器</dt><dd><a href="/static/teriteri.html" target="_blank">打开</a> <span class="meta-note">轻量预览兜底</span></dd>
    </dl>
  </div>`;
  renderSrcHealth();
  updateLive();
  loadTeriteri();
  loadMediaServers();
  if(window.__dashTimer) clearInterval(window.__dashTimer);
  window.__dashTimer = setInterval(()=>{ if(page==='dash') updateLive(); }, 2000);
}

async function loadMediaServers(){
  const box = document.getElementById('msBox'); if(!box) return;
  const list = await fetch('/api/v1/media-servers/status').then(r=>r.json()).catch(()=>null);
  if(!box) return;
  if(!list || !list.length){
    box.innerHTML = '<span class="meta-note">未配置——在 config.yaml 的 media.servers 里添加 teriteri / emby / jellyfin / plex / kodi 实例后，这里显示在线状态</span>';
    return;
  }
  box.innerHTML = list.map(s=>{
    const dot = s.online ? '<span class="dot ok"></span>在线' : '<span class="dot err"></span>离线';
    const lat = s.online ? ` · ${s.latency_ms}ms` : '';
    const link = s.url ? `<a href="${esc(s.url)}" target="_blank">${esc(s.url)}</a>` : '<span class="meta-note">未配置地址</span>';
    return `<div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)">
      <span style="min-width:170px"><b style="font-weight:500">${esc(s.name)}</b> <span class="meta-note">${esc(s.type)}</span></span>
      <span class="st" style="min-width:90px">${dot}${lat}</span>
      <span class="st" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${link}</span>
      <span class="meta-note">${esc(s.note||'')}</span>
    </div>`;
  }).join('');
}

async function updateLive(){
  const l = window.__live || await fetch('/api/v1/live').then(r=>r.json()).catch(()=>null);
  if(!l) return;
  const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  set('lvDl', fmtB(l.download_bps)); set('lvDlT', '累计 '+fmtBT(l.download_total));
  set('lvUl', fmtB(l.upload_bps));   set('lvUlT', '累计 '+fmtBT(l.upload_total));
  set('lvRun', l.running||0); set('lvQ', l.queued||0);
  const box = document.getElementById('lvJobs');
  if(box){
    const js = l.jobs||[];
    box.innerHTML = (js.length? js.map(j=>`
      <div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)">
        <span class="st" style="min-width:70px">#${j.id} ${esc(j.type)}</span>
        <div class="pbar" style="flex:1"><i style="width:${Math.max(2,Math.round((j.progress||0)*100))}%"></i></div>
        <span class="st num" style="min-width:40px">${Math.round((j.progress||0)*100)}%</span>
        <span class="st" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(j.detail||'')}</span>
      </div>`).join('') : '<span class="meta-note">当前没有进行中的任务</span>');
  }
}

async function renderSrcHealth(){
  const box = document.getElementById('srcHealth'); if(!box) return;
  const cfg = await api('/config').catch(()=>null);
  const srcs = await api('/sources').catch(()=>[]);
  if(!srcs||!srcs.length){ box.innerHTML='<span class="meta-note">还没有监控源</span>'; return; }
  const defMin = cfg ? cfg.sync_default_minutes : 360;
  box.innerHTML = `<table><thead><tr><th>源</th><th>类型</th><th>模式</th><th>上次同步</th><th>下次同步</th><th></th></tr></thead><tbody>`+
    srcs.map(x=>{
      let next='—';
      if(!x.watch) next='<span class="meta-note">已暂停</span>';
      else if(x.sync_mode==='once') next = x.last_sync_at?'<span class="meta-note">已完成</span>':'首次待同步';
      else {
        const iv=(x.sync_interval_minutes||defMin)*60;
        next = x.last_sync_at ? fmtT(x.last_sync_at+iv) : '待首次同步';
      }
      return `<tr><td>${esc(x.title)}</td><td class="st">${esc(x.type)}</td>
        <td class="st">${x.watch?(x.sync_mode==='once'?'<span class="dot warn"></span>仅一次':'<span class="dot ok"></span>周期'):'<span class="dot off"></span>暂停'}</td>
        <td class="st">${fmtT(x.last_sync_at)}</td><td class="st">${next}</td>
        <td><button class="btn sm" onclick="syncSrc(${x.id})">同步</button></td></tr>`;
    }).join('')+'</tbody></table>';
}

/* ============ 采集 ============ */
const TYPE_META = {
  video:   { name:'单视频', hint:'归档弹幕/评论/字幕/统计。跟踪可选仅一次或周期重同步（周期模式检测消失与变化）。' },
  space:   { name:'UP主',   hint:'展开全部投稿并持续跟踪。注意：投稿列表接口需已扫码登录。' },
  favlist: { name:'收藏夹', hint:'展开收藏夹全部视频；新增收藏触发补档。无需登录。' },
  season:  { name:'合集',   hint:'展开合集全部视频；合集更新触发补档。无需登录。' },
  series:  { name:'系列',   hint:'展开系列全部视频；系列更新触发补档。无需登录。' },
};
function renderAdd(m){
  m.innerHTML = `
  <div class="pagehead"><h1>采集</h1><span class="desc">识别链接后展开对应选项</span></div>
  <div class="sect">
    <form onsubmit="return false">
      <div class="field"><label>输入</label>
        <input type="text" id="inp" placeholder="视频链接 / BV号 / UP主主页 / 收藏夹 / 合集链接"></div>
      <div id="recognize"></div>
      <div id="baseOpts" style="display:none" class="inline">

      </div>

        <div class="inline">
          <div class="field"><label>同步模式</label>
            <select id="syncMode"><option value="interval">周期同步</option><option value="once">仅一次</option></select></div>
          <div class="field"><label>主刷新间隔（分）</label><input type="number" id="ivMain" value="0" min="0"><span class="hint">0 = 全局默认</span></div>
        </div>
        <div class="inline">
          <div class="field"><label>评论间隔（分）</label><input type="number" id="ivCmt" value="0" min="-1"><span class="hint">-1 = 从不 · 0 = 跟随主间隔</span></div>
          <div class="field"><label>弹幕间隔（分）</label><input type="number" id="ivDm" value="0" min="-1"></div>
          <div class="field"><label>字幕间隔（分）</label><input type="number" id="ivSub" value="0" min="-1"></div>
        </div>
        <div class="meta-note" id="syncHint" style="margin-top:-4px;line-height:1.7"></div>
      </div>

        <button class="btn" id="rebuild">重建媒体库</button>
      </div>
    </form>
    <p></p><div class="pre" id="out" style="display:none"></div>
  </div>`;
  let t=null;
  $('#inp').addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(()=>recognizeInput(++recogSeq),350); });
  $('#syncMode').addEventListener('change', updateSyncHint);
  $('#go').onclick = async () => {
    const v=$('#inp').value.trim(); if(!v) return;
    const out=$('#out'); out.style.display='block'; out.textContent='提交中…';
    const submit = confirmHot => api('/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        input:v, download:$('#dl')?.checked, watch:$('#watch')?.checked,
        sync_mode:$('#syncMode')?.value||'interval', interval_minutes:+($('#ivMain')?.value)||0,
        interval_comments:+($('#ivCmt')?.value)||0, interval_danmaku:+($('#ivDm')?.value)||0,
        interval_subtitles:+($('#ivSub')?.value)||0, confirm_hot:confirmHot})});
    try{
      let r=await submit(false);
      if(r.need_confirm){
        out.style.display='block'; out.textContent=r.reason;
        if(!confirm(r.reason)) { out.textContent='已取消'; return; }
        r=await submit(true);
      }
      $('#inp').value=''; $('#recognize').innerHTML='';
      $('#baseOpts').style.display='none'; $('#typeOpts').style.display='none';
      out.style.display='none';
      toast('已入队，可在任务页跟踪进度', 'ok');
      const ok=document.createElement('div');
      ok.className='banner ok';
      ok.innerHTML='已入队（'+esc(r.type||'')+'）· <a href="#" onclick="switchPage(\'jobs\');return false">查看任务进度</a>'+(r.mode==='once'?' · 仅一次模式':'');
      $('#recognize').appendChild(ok);
      $('#inp').focus();
    }catch(e){
      out.style.display='block'; out.textContent='失败：'+e;
    }
  };
  $('#rebuild').onclick = async () => {
    const out=$('#out'); out.style.display='block'; out.textContent='重建中…';
    try{ out.textContent=JSON.stringify(await api('/media/rebuild',{method:'POST'}),null,1);}catch(e){out.textContent='失败：'+e;}
  };
}

const DL_LABELS = {

  season:'新视频自动下载（触发器）', series:'新视频自动下载（触发器）' };
let curType = '';
function syncHintText(type, mode){
  if(type==='video'){
    return mode==='once'
      ? '仅归档一次，之后不再跟踪（无消失检测）。单视频不涉及新视频触发器。'
      : '周期重同步：刷新播放量/统计并检测评论、弹幕消失。单视频不涉及新视频触发器。';
  }
  if(mode==='once'){
    return '仅一次：首次归档后自动停止监控——不再发现新视频，也不再刷新数据。';
  }
  return '按间隔周期刷新评论/弹幕/字幕与统计，并在此过程中发现新视频。'
    +'新视频是否自动下载由「新视频触发器」控制，可随时在监控源页调整；触发器关闭时新视频仍会归档数据，只是不下载文件。';
}
function updateSyncHint(){
  const el=$('#syncHint'); if(!el||!curType) return;
  const mode=$('#syncMode')?.value||'interval';

}

async function recognizeInput(seq){
  const box=$('#recognize'), val=$('#inp').value.trim();
  if(!val){ box.innerHTML=''; curType=''; $('#baseOpts').style.display='none'; $('#typeOpts').style.display='none'; return; }
  if(val.includes('b23.tv')){
    box.innerHTML='<div class="banner info">b23 短链 — 提交时自动展开识别</div>';
    showTypeUI('video'); return;
  }
  const r=await api('/resolve?input='+encodeURIComponent(val));
  if(seq!==recogSeq) return;
  const meta=TYPE_META[r.type];
  if(!r.ok||!meta){
    box.innerHTML=`<div class="banner warn">未识别 — ${esc(r.message||'请检查格式，或使用完整链接')}</div>`;
    $('#baseOpts').style.display='none'; $('#typeOpts').style.display='none'; return;
  }
  box.innerHTML=`<div class="banner ok"><b>${meta.name}</b> ${esc(r.ext_id)} — ${meta.hint}</div>`;
  showTypeUI(r.type);
}

let vState='', vDl='', vQ='', vSort='pubdate', vOrder='desc', vOffset=0;
const V_PAGE=20;
async function renderVideos(m){
  m.innerHTML = `
  <div class="pagehead"><h1>归档项目</h1><span class="desc">状态与完整度 · 观看请使用 teriteri 或媒体库</span></div>
  <div class="sect">

      <button data-st="gone"><span class="dot err"></span>已消失<span class="n" id="vNgone"></span></button>
      <button data-st="private"><span class="dot warn"></span>私有<span class="n" id="vNprivate"></span></button>
    </div>
    <div class="actions" style="margin-bottom:12px">

        <option value="0">未下载</option>
      </select>

    <div id="list" class="empty">加载中…</div>
    <div class="pgn" id="vpgn"></div>
  </div>`;

    b.classList.toggle('active', b.dataset.st===vState);
    b.onclick=()=>{ vState=b.dataset.st; vOffset=0; loadV(); };
  });
  $('#vdl').value=vDl;
  $('#vdl').onchange=()=>{ vDl=$('#vdl').value; vOffset=0; loadV(); };

  $('#list').addEventListener('click', e=>{
    const th=e.target.closest('th.th-sort'); if(!th) return;
    const col=th.dataset.sort;
    if(vSort===col){ vOrder = vOrder==='asc'?'desc':'asc'; }
    else { vSort=col; vOrder = col==='title'?'asc':'desc'; }
    vOffset=0; loadV();
  });
  await loadV();
}
const vSetN=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=fmtN(v); };
let vSeq=0;
async function loadV(){
  const list=document.getElementById('list'); if(!list) return;
  const seq=++vSeq;
  list.innerHTML='<div class="empty">加载中…</div>';
  try{
    const qp=new URLSearchParams();
    if(vState) qp.set('status',vState);
    if(vDl) qp.set('dl',vDl);
    if(vQ) qp.set('q',vQ);
    qp.set('sort',vSort); qp.set('order',vOrder);
    qp.set('limit',V_PAGE); qp.set('offset',vOffset);
    const r=await api('/videos?'+qp);
    if(seq!==vSeq) return; // 已有更新的查询在途，丢弃过期响应
    const c=r.counts||{};
    vSetN('vN',r.total||0); vSetN('vNok',c.ok||0); vSetN('vNgone',c.gone||0); vSetN('vNprivate',c.private||0);
    const rb=document.getElementById('vreset'); if(rb) rb.style.display=(vState||vDl||vQ)?'':'none';
    const items=r.items||[];
    const pg=document.getElementById('vpgn');
    if(!items.length){
      list.innerHTML=`<div class="empty">${vQ?'没有匹配的归档项目':(vState==='gone'?'没有已消失的归档项目':(vState==='private'?'没有私有状态的归档项目':(vState==='ok'?'没有正常状态的归档项目':'还没有归档项目，去「采集」页添加')))}</div>`;
      pg.style.display='none'; return;
    }
    const stTxt=s=>s==='ok'?'<span class="dot ok"></span>正常':(s==='gone'?'<span class="dot err"></span>已消失':'<span class="dot warn"></span>私有');
    const arr=col=> vSort===col ? (vOrder==='asc'?' <span class="arr">▲</span>':' <span class="arr">▼</span>') : '';
    list.innerHTML=`<table><thead><tr><th></th>
      <th class="th-sort" data-sort="title">项目${arr('title')}</th>
      <th class="th-sort" data-sort="pubdate">发布${arr('pubdate')}</th>
      <th>完整度</th><th>状态</th>
      <th class="th-sort" data-sort="last_sync">最后同步${arr('last_sync')}</th>
      <th></th></tr></thead><tbody>`+
      items.map(v=>`<tr>
        <td class="thumb"><img src="${esc(v.pic)}" loading="lazy" onerror="this.style.visibility='hidden'"></td>
        <td><a href="#" onclick="openArchive('${v.bvid}');return false">${esc(v.title)}</a>
            <div class="cell-sub">${esc(v.owner_name)} · ${esc(v.bvid)}</div></td>
        <td class="st">${fmtT(v.pubdate)}</td>
        <td class="tagtext">视频 <b>${v.downloaded?'✓':'—'}</b> · 评论 <b>${v.comments_visible}</b>${v.comments_deleted?` <span style="color:var(--faint)">(+${v.comments_deleted} 消失)</span>`:''} · 弹幕 <b>${v.danmaku_count}</b> · 字幕 <b>${v.subtitle_count}</b></td>
        <td class="st">${stTxt(v.status)}</td>
        <td class="st">${fmtT(v.last_sync_at)}</td>
        <td><div class="actions">
          <button class="btn sm" onclick="syncOne('${v.bvid}', this)">重同步</button>
          ${v.downloaded?'':`<button class="btn sm" onclick="dlVideo('${v.bvid}', this)">下载</button>`}
          <button class="btn sm" onclick="window.open('/api/v1/videos/${v.bvid}/card','_blank')">卡片</button>
        </div></td></tr>`).join('')+'</tbody></table>';
    const pages=Math.max(1,Math.ceil((r.total||0)/V_PAGE));
    const page=Math.floor(vOffset/V_PAGE)+1;
    if(pages<=1){ pg.style.display='none'; return; }
    pg.style.display='flex';
    pg.innerHTML=`<button class="btn sm" id="vprev" ${page<=1?'disabled':''}>上一页</button>
      <span>第 ${page} / ${pages} 页 · 共 ${fmtN(r.total)} 条</span>
      <button class="btn sm" id="vnext" ${page>=pages?'disabled':''}>下一页</button>`;
    const prev=document.getElementById('vprev'), next=document.getElementById('vnext');
    if(prev) prev.onclick=()=>{ vOffset=(page-2)*V_PAGE; loadV(); };
    if(next) next.onclick=()=>{ vOffset=page*V_PAGE; loadV(); };
  }catch(e){
    list.innerHTML=`<div class="banner warn">加载失败：${esc(String(e))}</div>`;
  }
}

async function loadCmts(more){
  const bvid = document.querySelector('.pagehead .desc')?.textContent?.trim();
  if(!bvid) return;
  if(!more){ cmtOffset = 0; document.getElementById('cmtList').innerHTML='<span class="meta-note">加载中…</span>'; }
  const delOnly = document.getElementById('cmtDelOnly').checked;
  const list = await api(`/videos/${bvid}/comments?limit=100&offset=${cmtOffset}`+(delOnly?'&status=deleted':''));
  cmtOffset += list.length;
  const box = document.getElementById('cmtList');
  if(!more) box.innerHTML = list.length?'':'<span class="meta-note">暂无评论</span>';
  for(const c of list){

const hlTerms = (escaped, q) => {
  const terms = q.split(/\s+/).filter(Boolean).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if(!terms.length) return escaped;
  try{ return escaped.replace(new RegExp('('+terms.join('|')+')','gi'), '<mark>$1</mark>'); }
  catch(e){ return escaped; }
};

let tkState = '', tkQ = '', tkOffset = 0;
const TK_PAGE = 20;
async function renderTracks(m){
  m.innerHTML = `
  <div class="pagehead"><h1>跟踪列表</h1><span class="desc">监控源触发器发现的新视频，自动归档并下载一次</span></div>

      <button data-st="">全部<span class="n" id="tkN"></span></button>
      <button data-st="done"><span class="dot ok"></span>已下载<span class="n" id="tkNdone"></span></button>
      <button data-st="queued"><span class="dot run"></span>排队中<span class="n" id="tkNqueued"></span></button>
      <button data-st="failed"><span class="dot err"></span>失败<span class="n" id="tkNfailed"></span></button>
    </div>
    <div class="actions" style="margin-bottom:12px">
      <input type="text" id="tkq" placeholder="搜索标题 / UP主 / BV号…" value="${esc(tkQ)}" style="max-width:260px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:6px;font-size:13.5px">
      <button class="btn" id="tkgo">搜索</button>
      <button class="btn" id="tkreset" style="display:${(tkState||tkQ)?'':'none'}">清除筛选</button>
    </div>
    <div id="tklist" class="empty">加载中…</div>
    <div class="pgn" id="tkpgn"></div>
  </div>`;
  document.querySelectorAll('#tkTabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.st===tkState);
    b.onclick = () => { tkState=b.dataset.st; tkOffset=0; loadTk(); };
  });
  const run = () => { tkQ=$('#tkq').value.trim(); tkOffset=0; loadTk(); };
  $('#tkgo').onclick = run;
  $('#tkq').onkeydown = e => { if(e.key==='Enter') run(); };
  const reset = $('#tkreset');
  if(reset) reset.onclick = () => { tkState=''; tkQ=''; tkOffset=0; renderTracks($('#main')); };
  await loadTk();
}
const tkSetN = (id, v) => { const el=document.getElementById(id); if(el) el.textContent=fmtN(v); };
let tkSeq=0;
async function loadTk(){
  const list=document.getElementById('tklist'); if(!list) return;
  const seq=++tkSeq;
  list.innerHTML='<div class="empty">加载中…</div>';
  try{
    const qp=new URLSearchParams();
    if(tkState) qp.set('state',tkState);
    if(tkQ) qp.set('q',tkQ);
    qp.set('limit',TK_PAGE); qp.set('offset',tkOffset);
    const r = await api('/tracks?'+qp);
    if(seq!==tkSeq) return; // 已有更新的查询在途，丢弃过期响应
    const c=r.counts||{};
    tkSetN('tkN', r.total||0); tkSetN('tkNdone', c.done||0); tkSetN('tkNqueued', c.queued||0); tkSetN('tkNfailed', c.failed||0);
    const rb=document.getElementById('tkreset');
    if(rb) rb.style.display=(tkState||tkQ)?'':'none';
    const items=r.items||[];
    const pg=document.getElementById('tkpgn');
    if(!items.length){
      list.innerHTML = `<div class="empty">${tkQ?'没有匹配的跟踪记录':(tkState==='failed'?'没有失败的跟踪记录':(tkState==='queued'?'没有排队中的记录':(tkState==='done'?'还没有已下载的跟踪记录':'暂无记录——在「监控源」的设置里开启「新视频触发器」，源内出现新视频时会自动下载并记录在这里')))}</div>`;
      pg.style.display='none'; return;
    }
    list.innerHTML = `<table><thead><tr><th>视频</th><th>UP主</th><th>来源</th><th>状态</th><th>发现时间</th></tr></thead><tbody>`+
      items.map(t=>{
        const st = t.state==='done' ? '<span class="dot ok"></span>已下载'
          : (t.state==='failed' ? '<span class="dot err"></span>失败' : '<span class="dot run"></span>排队/进行中');
        return `<tr>
        <td>${t.title?`<a href="#" onclick="openArchive('${t.bvid}');return false">${esc(t.title)}</a>`:'<b style="font-weight:500">（归档中）</b>'}
          <div class="cell-sub">${esc(t.bvid)}${t.downloaded?' · 文件在库':''}</div></td>
        <td class="st">${esc(t.owner_name)||'—'}</td>
        <td class="st">${t.source_id?(esc(t.source_title)||('源 #'+t.source_id)):'—'}</td>
        <td class="st">${st}${t.state==='failed'&&t.error?`<div class="cell-sub" style="color:var(--err);max-width:280px;white-space:normal">${esc(t.error)}</div>`:''}</td>
        <td class="st">${fmtT(t.created_at)}</td>
        </tr>`;
      }).join('')+'</tbody></table>';
    const pages = Math.max(1, Math.ceil((r.total||0)/TK_PAGE));
    const page = Math.floor(tkOffset/TK_PAGE)+1;
    if(pages<=1){ pg.style.display='none'; return; }
    pg.style.display='flex';
    pg.innerHTML = `<button class="btn sm" id="tkprev" ${page<=1?'disabled':''}>上一页</button>
      <span>第 ${page} / ${pages} 页 · 共 ${fmtN(r.total)} 条</span>
      <button class="btn sm" id="tknext" ${page>=pages?'disabled':''}>下一页</button>`;
    const prev=document.getElementById('tkprev'), next=document.getElementById('tknext');
    if(prev) prev.onclick = () => { tkOffset=(page-2)*TK_PAGE; loadTk(); };
    if(next) next.onclick = () => { tkOffset=page*TK_PAGE; loadTk(); };
  }catch(e){
    list.innerHTML = `<div class="banner warn">加载失败：${esc(String(e))}</div>`;
  }
}

  let html = `<table><thead><tr><th>媒体库</th><th class="num">新建</th><th class="num">跳过</th></tr></thead><tbody>`+
    (r.libraries||[]).map(l=>`<tr><td>${esc(l.name)}</td><td class="num">${l.created}</td><td class="num">${l.skipped}</td></tr>`).join('')+
    `</tbody></table>`;
  if(r.errors&&r.errors.length) html += `<div class="banner warn" style="margin-top:10px">${r.errors.map(esc).join('<br>')}</div>`;
  let box = document.getElementById('rebuildResult');
  if(!box){ box=document.createElement('div'); box.id='rebuildResult';
    document.querySelector('.pagehead').insertAdjacentElement('afterend', box); }
  box.innerHTML = `<div class="sect"><h2>重建结果</h2>${html}</div>`;
};
window.newLib = () => {

};
window.editLib = id => api('/libraries').then(libs=>{

  $('#leTitle').textContent='编辑 '+l.name; $('#libEdit').dataset.id=id;

window.saveLib = async () => {
  const id=$('#libEdit').dataset.id;
  const tags=$('#leTags').value.split(',').map(x=>x.trim()).filter(Boolean);
  const cats=$('#leCats').value.split(',').map(x=>x.trim()).filter(Boolean);
  const rules={};
  if(tags.length) rules.tags=tags;
  if(cats.length) rules.categories=cats;
  const body={name:$('#leName').value.trim(), root_path:$('#leRoot').value.trim(),
    layout:$('#leLayout').value, link_mode:$('#leLink').value, metadata_format:$('#leMeta').value,
    match_rules:JSON.stringify(rules), enabled:$('#leEnabled').checked};
  if(!body.name||!body.root_path){ alert('名称与路径必填'); return; }
  try{
    if(id){ await api('/libraries/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    else { await api('/libraries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    toast('媒体库已保存','ok'); renderLibraries($('#main'));
  }catch(e){ toast('保存失败：'+e,'err'); }
};
window.delLib = async id => { if(confirm('删除该媒体库配置？（不删除已输出的文件）')){ await api(`/libraries/${id}`,{method:'DELETE'}); renderLibraries($('#main')); } };

/* ============ 任务 ============ */
async function renderJobs(m){
  const js=await api('/jobs?limit=60');
  m.innerHTML=`
  <div class="pagehead"><h1>任务</h1><span class="desc">队列与执行状态</span>
    <span class="spacer"></span><button class="btn" onclick="syncNow()">全部同步</button></div>
  <div class="sect">
    ${(js&&js.length)?`<table><thead><tr><th class="num">#</th><th>类型</th><th>载荷</th><th>状态</th><th>进度</th><th>详情</th><th>时间</th></tr></thead><tbody>`+
    js.map(j=>{
      let p=''; try{p=Object.values(JSON.parse(j.payload_json)).join(' ');}catch(e){}
      const dot={done:'ok',failed:'err',running:'run',queued:'queued'}[j.state]||'off';
      return `<tr><td class="num">${j.id}</td><td class="st">${esc(j.type)}</td><td class="st">${esc(p)}</td>
      <td class="st"><span class="dot ${dot}"></span>${j.state}</td>
      <td style="min-width:110px"><div class="pbar ${j.state==='done'?'done':''}"><i style="width:${Math.max(2,Math.round(j.progress*100))}%"></i></div><span class="meta-note">${Math.round(j.progress*100)}%</span></td>
      <td class="st">${esc(j.detail||j.error).slice(0,60)}</td><td class="st">${fmtT(j.created_at)}</td>
      <td>${j.state==='failed'?`<button class="btn sm" onclick="retryJob(${j.id})">重试</button>`:''}</td></tr>`;}).join('')+'</tbody></table>':'<div class="empty">暂无任务</div>'}
  </div>`;
  clearInterval(timer);
  const hasActive = (js||[]).some(j=>j.state==='running'||j.state==='queued');
  if(hasActive){ // 仅存在活动任务时轮询；保持滚动位置避免闪烁
    const y = window.scrollY;
    timer=setInterval(async()=>{ if(page!=='jobs'){clearInterval(timer);return;}
      await renderJobs(m); window.scrollTo(0,y); }, 3000);
  }
}
window.retryJob = async id => { try{ await api(`/jobs/${id}/retry`,{method:'POST'}); toast('任务 #'+id+' 已重新入队','ok'); renderJobs($('#main')); }catch(e){ toast('重试失败：'+e,'err'); } };
window.syncNow = async () => { try{ const r=await api('/sync-now',{method:'POST'}); toast('已排队 '+r.queued+' 个源','ok'); renderJobs($('#main')); }catch(e){ toast('失败：'+e,'err'); } };

/* ============ 账号 ============ */
async function renderLogin(m){
  m.innerHTML=`
  <div class="pagehead"><h1>账号</h1><span class="desc">B 站扫码登录（保存在本机）</span></div>
  <div class="sect">
    <div class="inline" style="align-items:flex-start">
      <img id="qrimg" alt="二维码" style="width:200px;height:200px;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;background:var(--bg)">
      <div style="flex:1;max-width:340px">
        <p id="qrstate" class="st" style="margin-bottom:10px;font-size:13px;color:var(--txt)">获取中…</p>
        <p class="meta-note">登录后可用：1080P 高码率 / 4K（大会员）、UP主投稿列表、评论消失检测（未登录时 B 站只返回部分评论，无法对账）。</p>
      </div>
    </div>
  </div>`;
  try{
    const r=await api('/login/qr');
    $('#qrimg').src='data:image/png;base64,'+r.png_base64;
    $('#qrstate').textContent='等待扫码…';
    const poll=async()=>{
      const p=await api('/login/qr/poll?key='+encodeURIComponent(r.key));
      if(p.code===0){ $('#qrstate').textContent='✓ 登录成功，cookie 已保存'; return; }
      if(p.code===86090){ $('#qrstate').textContent='已扫码，请在手机确认…'; }
      else if(p.code===86038){
        $('#qrstate').innerHTML='二维码过期 <button class="btn sm" onclick="renderLogin(document.querySelector(\'#main\'))">重新获取</button>';
        return;
      }
      setTimeout(poll,2000);
    };
    poll();
  }catch(e){ $('#qrstate').textContent='获取二维码失败：'+e; }
}

window.reloadPlugins = async () => { const r=await api('/plugins/reload',{method:'POST'}); alert('已加载 '+r.loaded+' 个插件'); renderPlugins($('#main')); };

async function loadTeriteri(){
  const box = document.getElementById('teriBox'); if(!box) return;
  let s; try{ s = await api('/teriteri/status'); }catch(e){ box.innerHTML='<span class="meta-note">不可用</span>'; return; }
  if(!s.available){ box.innerHTML='<span class="meta-note">未启用</span>'; return; }
  const inst = s.install||{};
  const serving = s.serving||{};
  const rows = [
    {name:'用户端 · 播放站', ready:s.client_ready, url:s.client_url, serve:serving['teriteri-client']},
    {name:'管理员端 · 审核台', ready:s.admin_ready, url:s.admin_url, serve:serving['teriteri-admin']},
  ];
  box.innerHTML = `
    ${rows.map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:4px 0;flex-wrap:wrap">
      <span class="dot ${r.ready?'ok':'warn'}"></span><b style="min-width:150px">${r.name}</b>
      ${r.ready?`<a href="${esc(r.url)}" target="_blank">${esc(r.url)}</a> <span class="meta-note">${r.serve?'已托管':'待重启核心后托管'}</span>`:`<span class="meta-note">未安装</span>`}
    </div>`).join('')}
    ${inst.running?`<div class="pbar" style="margin-top:10px"><i style="width:${Math.max(2,Math.round((inst.progress||0)*100))}%"></i></div>
      <div class="meta-note" style="margin-top:4px">${esc(inst.step||'')} · ${Math.round((inst.progress||0)*100)}%</div>
      <pre style="margin-top:6px;max-height:150px;overflow:auto;background:#f6f7f8;padding:8px;border-radius:8px;font-size:12px;white-space:pre-wrap">${esc((inst.logs||[]).join(String.fromCharCode(10)))}</pre>`
    : inst.error?`<div class="meta-note" style="color:#c0392b;margin-top:6px">上次安装失败：${esc(inst.error)}</div>`:''}
    <div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn" ${inst.running?'disabled':''} onclick="teriteriInstall()">${inst.running?'安装中…':(s.client_ready||s.admin_ready?'重新构建多端':'一键安装（克隆 + npm 构建）')}</button>
      <span class="meta-note">需系统 git 与 Node.js；完成后由核心自动托管，API/媒体/弹幕 WS 进程内直通</span>
    </div>`;
  if(window.__teriTimer) clearInterval(window.__teriTimer);
  if(inst.running){ window.__teriTimer = setInterval(()=>{ if(page!=='dash') clearInterval(window.__teriTimer); else loadTeriteri(); }, 2000); }
}
async function teriteriInstall(){
  try{
    const r = await fetch('/api/v1/teriteri/install', {method:'POST'});
    if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error || ('HTTP '+r.status)); }
  }catch(e){ alert('启动安装失败: '+e.message); }
  loadTeriteri();
}
</script>
